<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pico Certo</title>
<meta name="description" content="Previsão de surf pela sua localização: o melhor pico e o melhor horário pra cair.">
<meta name="theme-color" content="#0f3b52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pico Certo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: uma coluna de app. Resumo primeiro (melhor pico e janela), depois a lista e, num painel, as horas. */
:root {
  --bg: #eef3f5;
  --surface: #ffffff;
  --surface-2: #f4f8f9;
  --ink: #0d1e28;
  --ink-2: #465a66;
  --muted: #6c7e87;
  --line: #d6e0e5;
  --accent: #d2501a;
  --accent-ink: #ffffff;
  --accent-text: #b0430f;
  --wash: rgba(13, 30, 40, 0.05);
  /* nota: rampa sequencial de um tom (azul), da pior para a melhor */
  --s0: #cfd8dd; --s0-ink: #0d1e28;
  --s1: #9ec5f4; --s1-ink: #0d1e28;
  --s2: #5598e7; --s2-ink: #0d1e28;
  --s3: #256abf; --s3-ink: #ffffff;
  --s4: #0d366b; --s4-ink: #ffffff;
  --tide: #2a78d6;
  --tile-filter: none;
  --perigo: #c8372f;
  --alerta-bg: #fff0cc; --alerta-ink: #5c3b00; --alerta-icone: #e09a00;
  /* vento no gráfico da semana: terral (bom), lateral, maral (ruim) */
  --v-terral: #1baf7a; --v-lateral: #eda100; --v-maral: #e34948;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1318; --surface: #111d24; --surface-2: #15232b;
    --ink: #e6eef2; --ink-2: #a9bac3; --muted: #82949d; --line: #233540;
    --accent: #f07a3e; --accent-ink: #0a1318; --accent-text: #f59a66;
    --wash: rgba(230, 238, 242, 0.06);
    --s0: #2c3b44; --s0-ink: #e6eef2;
    --s1: #1c5cab; --s1-ink: #ffffff;
    --s2: #2a78d6; --s2-ink: #ffffff;
    --s3: #6da7ec; --s3-ink: #0a1318;
    --s4: #b7d3f6; --s4-ink: #0a1318;
    --tide: #6da7ec;
    --tile-filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9);
    --alerta-bg: #3a2b08; --alerta-ink: #ffdc9c; --alerta-icone: #fab219;
    --v-terral: #199e70; --v-lateral: #c98500; --v-maral: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1318; --surface: #111d24; --surface-2: #15232b;
  --ink: #e6eef2; --ink-2: #a9bac3; --muted: #82949d; --line: #233540;
  --accent: #f07a3e; --accent-ink: #0a1318; --accent-text: #f59a66;
  --wash: rgba(230, 238, 242, 0.06);
  --s0: #2c3b44; --s0-ink: #e6eef2;
  --s1: #1c5cab; --s1-ink: #ffffff;
  --s2: #2a78d6; --s2-ink: #ffffff;
  --s3: #6da7ec; --s3-ink: #0a1318;
  --s4: #b7d3f6; --s4-ink: #0a1318;
  --tide: #6da7ec;
  --tile-filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9);
  --alerta-bg: #3a2b08; --alerta-ink: #ffdc9c; --alerta-icone: #fab219;
  --v-terral: #199e70; --v-lateral: #c98500; --v-maral: #e66767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}
body.travado { overflow: hidden; }
[hidden] { display: none !important; }
a { color: inherit; }
button { font: inherit; color: inherit; }
button, select, summary, [role="button"] { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; }

.app { max-width: 680px; margin: 0 auto; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 18px; }

/* topo */
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { margin: 0; display: flex; align-items: center; gap: 8px; font: 700 26px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
.marca img { width: 32px; height: 32px; flex: 0 0 auto; border-radius: 8px; }
.local {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 62%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 7px 12px; font: 500 14px var(--body);
}
.local svg { width: 15px; height: 15px; flex: 0 0 auto; fill: var(--accent-text); }
.local span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* controles */
.controles { display: flex; flex-direction: column; gap: 12px; }
.dias { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
.dias::-webkit-scrollbar { display: none; }
.chip-dia {
  flex: 0 0 auto; display: grid; grid-template-rows: auto 30px auto; justify-items: center; gap: 4px;
  min-width: 60px; padding: 8px 6px 6px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: 500 13px var(--body);
}
.chip-dia[aria-selected="true"] { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cd-barra { width: 12px; height: 30px; display: flex; align-items: flex-end; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.cd-fill { width: 100%; border-radius: 3px 3px 0 0; background: var(--c); }
.cd-nota { font: 600 16px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }

.linha-ctrl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: 500 14px var(--body); padding: 6px 10px; border-radius: 7px; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); }
.raio { font-size: 14px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
select, input { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }

/* classes de nota */
.s0 { --c: var(--s0); --ci: var(--s0-ink); }
.s1 { --c: var(--s1); --ci: var(--s1-ink); }
.s2 { --c: var(--s2); --ci: var(--s2-ink); }
.s3 { --c: var(--s3); --ci: var(--s3-ink); }
.s4 { --c: var(--s4); --ci: var(--s4-ink); }
.pill {
  display: inline-flex; justify-content: center; align-items: center; min-width: 46px; padding: 4px 8px; border-radius: 8px;
  background: var(--c); color: var(--ci); font: 700 19px/1.1 var(--display); font-variant-numeric: tabular-nums;
}
.pill.pq { min-width: 38px; font-size: 16px; padding: 2px 6px; }

/* destaque */
.destaque { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { margin: 0; font: 600 12px var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.dest-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dest-nome { min-width: 0; }
.dest-nome h2 { margin: 0; font: 700 clamp(30px, 8vw, 42px)/0.95 var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
.nota-grande { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 88px; padding: 8px 10px 7px; border-radius: 12px; background: var(--c); color: var(--ci); }
.ng-num { font: 700 46px/1 var(--display); }
.ng-rot { font: 600 11px var(--body); letter-spacing: 0.07em; text-transform: uppercase; }
.janela { margin: 0; display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
.jan-hora { font: 700 32px/1 var(--display); font-variant-numeric: tabular-nums; }
.veredito { font: 600 15px var(--body); color: var(--accent-text); }
.chegada { margin: -6px 0 0; font-size: 14px; color: var(--ink-2); }

.faixa { display: flex; flex-direction: column; gap: 3px; }
.fx-barras { display: flex; align-items: flex-end; justify-content: space-between; gap: 2px; height: 46px; border-bottom: 1px solid var(--line); }
.faixa.compacta .fx-barras { height: 26px; }
.fx-barras i { flex: 1 1 0; max-width: 24px; background: var(--c); border-radius: 3px 3px 0 0; opacity: 0.4; }
.fx-barras i.dentro { opacity: 1; }
.fx-barras i.passou { opacity: 0.15; }
.fx-eixo { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.fatos { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.fatos > div { min-width: 0; }
.fatos dt { font: 600 11px var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.fatos dd { margin: 2px 0 0; font: 500 15px/1.35 var(--body); }
.leve { color: var(--muted); font-size: 13px; font-weight: 400; }
.seta { width: 14px; height: 14px; vertical-align: -2px; fill: currentColor; display: inline-block; }
.porque { margin: 0; color: var(--ink-2); }
.comp { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; color: var(--ink-2); }
.comp button { border: 0; background: none; padding: 0; color: var(--accent-text); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { appearance: none; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 600 16px var(--body); padding: 12px 16px; text-decoration: none; text-align: center; }
.btn-sec { appearance: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; font: 600 15px var(--body); padding: 9px 13px; text-decoration: none; }
.btn-sec svg { width: 16px; height: 16px; fill: currentColor; }

/* lista */
.secao-tit { margin: 0 0 8px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font: 700 21px/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
.lista-picos, .linhas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item {
  width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px 12px;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
.item:hover { border-color: var(--muted); }
.it-nome { display: flex; flex-direction: column; min-width: 0; }
.it-nome strong { font: 600 17px/1.2 var(--body); }
.it-nome .leve { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it-jan { font: 600 19px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.it-faixa { grid-column: 1 / -1; }

/* ajustes */
.ajustes-corpo { display: flex; flex-direction: column; gap: 12px; }
.ajustes-corpo .bloco { display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; }
.ajustes-corpo .bloco .secao-tit { margin: 0; }
.ajustes-corpo p { margin: 0; }
.aj-linha { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sobre p { font-size: 14px; color: var(--ink-2); }
.aj-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.campo { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-2); min-width: 0; }
.campo span { display: flex; align-items: center; gap: 6px; color: var(--ink); }
.campo input, .campo select { width: 100%; }
.campo-largo { grid-column: 1 / -1; }
.form-pico { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: end; }
.form-pico .btn { grid-column: 1 / -1; }
.custom { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.custom li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 14px; }
.custom button { border: 0; background: none; color: var(--accent-text); font-weight: 600; }

/* telas de estado */
.inicio, .estado { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; }
.inicio h2, .estado h2 { margin: 0; font: 700 30px/1 var(--display); text-transform: uppercase; }
.inicio p, .estado p { margin: 0; color: var(--ink-2); }
.aviso { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink) !important; font-size: 14px; }
.cidade { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }
.carregando { display: flex; flex-direction: column; gap: 10px; }
.onda-anim { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--s1), var(--s3), var(--s1)); background-size: 200% 100%; animation: mar 1.4s linear infinite; }
@keyframes mar { to { background-position: -200% 0; } }

.rodape { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.rodape p { margin: 0; }

/* painel de detalhe */
.painel {
  position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
}
.painel-int { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.det-topo { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-block: 10px 6px; }
.voltar { border: 0; background: none; padding: 6px 0; font: 600 16px var(--body); display: inline-flex; gap: 6px; align-items: center; }
.voltar svg { width: 18px; height: 18px; fill: currentColor; }
.det-cab h2 { margin: 0; font: 700 clamp(32px, 9vw, 44px)/0.95 var(--display); text-transform: uppercase; }
.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 10px; min-width: 0; }
.bloco .secao-tit { font-size: 19px; }
.leitura { margin: 0 0 8px; font-size: 14px; color: var(--ink-2); min-height: 2.9em; }
.leitura strong { color: var(--ink); }
.graf { display: block; overflow: visible; }
.graf .grade { stroke: var(--line); stroke-width: 1; }
.graf .base { stroke: var(--muted); stroke-width: 1; }
.graf .eixo { fill: var(--muted); font: 500 11px var(--body); font-variant-numeric: tabular-nums; }
.graf .b { fill: var(--c); }
.graf .hit { fill: transparent; }
.graf .col { outline: none; }
.graf .col:focus-visible .b { stroke: var(--accent); stroke-width: 2; }
.graf .col.sel .eixo { fill: var(--ink); font-weight: 700; }
.graf .marca-sel { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.graf .jan-faixa { fill: var(--wash); }
.graf .jan-rot { fill: var(--ink-2); font: 600 11px var(--body); }
.graf .agora { stroke: var(--accent); stroke-width: 1.5; }
.graf .agora-rot { fill: var(--accent-text); font: 600 11px var(--body); }
.graf .dia-faixa { fill: var(--wash); }
.graf .mare-linha { fill: none; stroke: var(--tide); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.graf .mare-area { fill: var(--tide); opacity: 0.1; }
.graf .mare-ponto { fill: var(--tide); stroke: var(--surface); stroke-width: 2; }
.graf .mare-rot { fill: var(--ink-2); font: 600 11px var(--body); font-variant-numeric: tabular-nums; }

.rolagem { overflow-x: auto; margin-inline: -14px; padding-inline: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 600 11px var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; }
tr.na-jan td { background: var(--wash); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--ink); font-weight: 700; }
tbody tr { cursor: pointer; }

#conteudo, .det-col { display: flex; flex-direction: column; gap: 18px; }

/* diário de sessões */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cat-grade .cat:last-child:nth-child(odd) { grid-column: 1 / -1; }
.fav svg:not(.estrela) { width: 16px; height: 16px; }
.diario-resumo { display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
.graf-tit { margin: 4px 0 0; }
.graf .barra-diario { fill: var(--tide); }
.sessoes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sessao { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.sessao p { margin: 0; font-size: 14px; color: var(--ink-2); }
.sessao .ss-obs { color: var(--ink); font-style: italic; }
.ss-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ss-nota { flex: 0 0 auto; color: var(--alerta-icone); font-size: 17px; letter-spacing: 1px; }
.ss-acoes { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 14px; }
.link { border: 0; background: none; padding: 2px 0; color: var(--muted); font: 500 14px var(--body); text-decoration: underline; text-underline-offset: 2px; }
.form-sessao { display: flex; flex-direction: column; gap: 14px; padding-bottom: 16px; }
.form-sessao fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.form-sessao legend { padding: 0; margin-bottom: 6px; font-size: 14px; color: var(--ink-2); }
.form-sessao textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; width: 100%; }
/* estrelas: a ordem no HTML é 5..1, mostrada 1..5; marcar uma acende ela e as de antes */
.estrelas { display: inline-flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; }
.estrelas input, .chips input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.estrelas label { font-size: 34px; line-height: 1; color: var(--line); cursor: pointer; }
.estrelas input:checked ~ label, .estrelas label:hover, .estrelas label:hover ~ label { color: var(--alerta-icone); }
.estrelas input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font: 500 14px var(--body); cursor: pointer; }
.chips input:checked + label { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent-text); }
.chips input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

/* onda x surfista */
.onda-svg { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; overflow: hidden; }
.ov-agua { fill: var(--tide); opacity: 0.25; }
.ov-onda { fill: var(--tide); }
.ov-espuma { fill: #ffffff; }
.ov-surfista { fill: var(--ink); }
.ov-prancha { fill: var(--accent); }
.ov-linha { stroke: var(--ink); stroke-opacity: 0.35; stroke-width: 1; }
